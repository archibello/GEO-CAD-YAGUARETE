<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4a2f"/>
    </marker>
  </defs>
  <!-- QGIS -->
  <circle cx="160" cy="330" r="110" fill="#e6f2e1" stroke="#4d8a3a" stroke-width="3"/>
  <text x="160" y="318" text-anchor="middle" font-size="26" font-weight="bold" fill="#2f5d22">QGIS</text>
  <text x="160" y="344" text-anchor="middle" font-size="14" fill="#2f5d22">el SIG: dónde está</text>
  <text x="160" y="362" text-anchor="middle" font-size="14" fill="#2f5d22">cada cosa y qué datos tiene</text>
  <!-- IngeCAD -->
  <circle cx="600" cy="330" r="110" fill="#e3ecf7" stroke="#3a64a0" stroke-width="3"/>
  <text x="600" y="318" text-anchor="middle" font-size="26" font-weight="bold" fill="#234575">IngeCAD</text>
  <text x="600" y="344" text-anchor="middle" font-size="14" fill="#234575">el CAD: dibujar</text>
  <text x="600" y="362" text-anchor="middle" font-size="14" fill="#234575">con precisión de plano</text>
  <!-- Google Earth -->
  <circle cx="380" cy="120" r="100" fill="#fbf0dc" stroke="#c08a2d" stroke-width="3"/>
  <text x="380" y="110" text-anchor="middle" font-size="24" font-weight="bold" fill="#7a5414">Google Earth</text>
  <text x="380" y="136" text-anchor="middle" font-size="14" fill="#7a5414">imagen de cualquier</text>
  <text x="380" y="154" text-anchor="middle" font-size="14" fill="#7a5414">lugar del mundo</text>
  <!-- Puente QGIS-IngeCAD -->
  <line x1="275" y1="318" x2="485" y2="318" stroke="#5b4a2f" stroke-width="3" marker-start="url(#f)" marker-end="url(#f)"/>
  <text x="380" y="306" text-anchor="middle" font-size="13" fill="#5b4a2f">Puente: capas, atributos,</text>
  <text x="380" y="340" text-anchor="middle" font-size="13" fill="#5b4a2f">rótulos, lo dibujado</text>
  <!-- GE-QGIS -->
  <line x1="300" y1="185" x2="215" y2="232" stroke="#5b4a2f" stroke-width="3" marker-start="url(#f)" marker-end="url(#f)"/>
  <text x="170" y="196" text-anchor="middle" font-size="13" fill="#5b4a2f">imagen ubicada ↓</text>
  <text x="170" y="214" text-anchor="middle" font-size="13" fill="#5b4a2f">KML / KMZ ↑</text>
  <!-- GE-IngeCAD -->
  <line x1="460" y1="185" x2="545" y2="232" stroke="#5b4a2f" stroke-width="3" marker-start="url(#f)" marker-end="url(#f)"/>
  <text x="600" y="196" text-anchor="middle" font-size="13" fill="#5b4a2f">imagen ubicada ↓</text>
  <text x="600" y="214" text-anchor="middle" font-size="13" fill="#5b4a2f">KML / KMZ ↕</text>
  <!-- centro -->
  <text x="380" y="420" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b4a2f">GEO-CAD-YAGUARETÉ</text>
  <text x="380" y="444" text-anchor="middle" font-size="14" fill="#5b4a2f">un abrazo entre tres fronteras</text>
</svg>
